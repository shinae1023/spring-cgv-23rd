spring:
  application:
    name: vote-service
  datasource:
    url: jdbc:h2:mem:vote-service;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ceos-vote-service-local-secret-key-change-me
    expiration-minutes: 60
