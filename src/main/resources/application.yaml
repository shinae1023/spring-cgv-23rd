spring:
  application:
    name: vote-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:vote-service;MODE=MySQL;DATABASE_TO_UPPER=false}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:false}
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:}
    name: ${ADMIN_NAME:}
    part: ${ADMIN_PART:BACKEND}
    team: ${ADMIN_TEAM:IPX}
